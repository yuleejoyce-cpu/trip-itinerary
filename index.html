<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 紐約班夫黃刀鎮極光之旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #fdf6ec;
    --ink: #6b5440;
    --ink-soft: #a6927c;
    --panel: #fffdf8;
    --panel-line: #e8d6ba;
    --pink: #f8cdd7;
    --pink-dark: #e8a3b4;
    --mint: #c9ead7;
    --mint-dark: #7fc3a3;
    --butter: #ffe3a1;
    --butter-dark: #e3b24f;
    --lavender: #ddd1f5;
    --lavender-dark: #b19be0;
    --peach: #ffceb0;
    --peach-dark: #e8925f;
    --accent: #e8927c;
    --accent-dark: #c96a52;
  }
  body {
    font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, 'Noto Sans CJK TC', sans-serif;
    overflow-x: hidden;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle, rgba(107,84,64,.08) 1px, transparent 1.4px);
    background-size: 18px 18px;
    min-height: 100vh;
    padding: 22px 8px 60px;
    color: var(--ink);
  }
  .container { max-width: 900px; margin: 0 auto; }
  @media (min-width: 640px) {
    body { padding: 28px 24px 70px; }
  }

  /* ===== Header ===== */
  .header { text-align: center; position: relative; margin-bottom: 20px; }
  .doodle { position: absolute; top: -14px; font-size: clamp(28px, 7vw, 48px); }
  .doodle.left { left: 4px; transform: rotate(-12deg); }
  .doodle.right { right: 4px; transform: rotate(12deg); }
  .header h1 {
    font-size: clamp(22px, 6vw, 34px); font-weight: 900; color: var(--accent-dark);
    letter-spacing: .5px; padding-top: 10px;
  }
  .header p {
    font-size: clamp(13px, 3.3vw, 19px); color: var(--ink-soft); margin-top: 5px;
    font-family: 'Baloo 2', sans-serif; font-weight: 600;
  }

  .updated-bar {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--panel);
    border: 2px dashed var(--panel-line);
    color: var(--ink-soft);
    font-size: clamp(12px, 3vw, 18px);
    border-radius: 999px;
    padding: 6px 16px;
    width: fit-content;
    margin: 0 auto 18px;
  }
  .updated-bar .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint-dark); }

  /* ===== 月曆卡片（手繪風） ===== */
  .cal-card {
    position: relative;
    background: var(--panel);
    border: 2.5px solid var(--ink);
    border-radius: 26px 30px 22px 28px / 24px 20px 28px 22px;
    box-shadow: 4px 5px 0 rgba(107,84,64,.15);
    padding: clamp(14px, 4vw, 20px) clamp(6px, 2.5vw, 14px) 14px;
    margin-bottom: 22px;
    transform: rotate(-.3deg);
  }
  .cal-tape {
    position: absolute; top: -12px; left: 50%; transform: translateX(-50%) rotate(-2deg);
    width: 70px; height: 22px;
    background: repeating-linear-gradient(135deg, var(--butter), var(--butter) 6px, #ffd976 6px, #ffd976 12px);
    opacity: .85;
    border-radius: 2px;
    box-shadow: 0 2px 3px rgba(0,0,0,.08);
  }
  .cal-weekdays, .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: clamp(3px, 1.2vw, 8px);
  }
  .cal-weekdays { margin-bottom: 7px; }
  .cal-weekdays span {
    text-align: center;
    font-size: clamp(12px, 3.3vw, 17px);
    font-weight: 700;
    color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center;
    width: clamp(22px, 6.5vw, 34px); height: clamp(22px, 6.5vw, 34px); margin: 0 auto;
    border-radius: 50%;
  }
  .cal-weekdays span.weekend { background: var(--pink); color: var(--accent-dark); }
  .cal-grid { margin-bottom: 14px; }
  .cal-cell {
    aspect-ratio: 1 / 1.2;
    border-radius: clamp(10px, 2.8vw, 16px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1px, .5vw, 3px);
    font-family: 'Baloo 2', sans-serif;
    position: relative;
  }
  .cal-cell.empty { visibility: hidden; }
  .cal-cell.pad { background: rgba(107,84,64,.04); color: var(--ink-soft); opacity: .55; }
  .cal-cell.pad .num { font-size: clamp(11px, 3vw, 17px); font-weight: 700; }
  .cal-cell.transit {
    background: var(--panel);
    border: 2px dashed var(--panel-line);
  }
  .cal-cell.transit .icon { font-size: clamp(16px, 4.6vw, 29px); }
  .cal-cell.transit .num { font-size: clamp(10px, 2.6vw, 15px); font-weight: 700; color: var(--ink-soft); }
  .cal-cell.transit .tag { font-size: clamp(8px, 2.1vw, 12px); }
  .cal-cell.trip {
    border: 2px solid var(--ink);
    box-shadow: 1.5px 2px 0 rgba(107,84,64,.18);
  }
  .cal-cell.trip[onclick] { cursor: pointer; }
  .cal-cell.trip:active { transform: translateY(1px); box-shadow: 1px 1px 0 rgba(107,84,64,.18); }
  .cal-cell .icon { font-size: clamp(16px, 4.3vw, 27px); line-height: 1; }
  .cal-cell .num { font-size: clamp(11px, 3.2vw, 19px); font-weight: 700; color: var(--ink); line-height: 1.1; }
  .cal-cell .tag { font-size: clamp(8px, 2.1vw, 13px); font-weight: 700; color: var(--ink); opacity: .85; white-space: normal; line-height: 1.15; padding: 0 2px; word-break: break-word; }

  .cal-legend {
    display: flex; flex-wrap: wrap; gap: 10px;
    padding-top: 12px; border-top: 2px dashed var(--panel-line);
  }
  .cal-legend .item {
    display: flex; align-items: center; gap: 6px;
    font-size: 14px; color: var(--ink-soft); font-weight: 600;
    background: rgba(107,84,64,.04);
    border-radius: 999px; padding: 5px 13px 5px 7px;
  }
  .cal-legend .swatch { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--ink); flex: none; }

  /* ===== 日期切換 ===== */
  .day-nav {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-bottom: 14px;
  }
  .nav-btn {
    width: clamp(24px, 6vw, 26px); height: clamp(24px, 6vw, 26px); border-radius: 50%;
    border: 2px solid var(--ink);
    background: var(--panel);
    color: var(--ink); font-size: clamp(16px, 4vw, 19px); font-weight: 700; line-height: 1;
    cursor: pointer;
    flex: none;
    box-shadow: 2px 2px 0 rgba(107,84,64,.15);
  }
  .nav-btn:active:not(:disabled) { transform: translateY(1px); box-shadow: 1px 1px 0 rgba(107,84,64,.15); }
  .nav-btn:disabled { opacity: .3; cursor: default; }
  .nav-label {
    color: var(--ink);
    font-size: clamp(13px, 3.5vw, 16px); font-weight: 700;
    font-family: 'Baloo 2', sans-serif;
    background: var(--butter);
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 5px clamp(10px, 3vw, 16px);
    min-width: 90px; text-align: center;
    box-shadow: 2px 2px 0 rgba(107,84,64,.12);
  }

  /* ===== 每日行程卡（明信片風） ===== */
  .day-card {
    position: relative;
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 20px 16px 22px 14px / 15px 20px 13px 22px;
    box-shadow: 3px 4px 0 rgba(107,84,64,.15);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .day-tape {
    position: absolute; top: -9px; left: 18px; transform: rotate(-4deg);
    width: 44px; height: 15px;
    background: repeating-linear-gradient(135deg, var(--mint), var(--mint) 6px, #a8dfc2 6px, #a8dfc2 12px);
    opacity: .85; border-radius: 2px;
    box-shadow: 0 2px 3px rgba(0,0,0,.08);
  }
  .day-main { display: flex; gap: clamp(6px, 2.5vw, 10px); padding: clamp(10px, 3.5vw, 14px) clamp(8px, 3vw, 13px) 10px; }
  .day-date-col { flex: 0 0 clamp(36px, 10vw, 44px); text-align: center; }
  .day-date-col .icon { font-size: clamp(20px, 6vw, 29px); display: block; margin-bottom: 2px; }
  .day-date-col .md { font-family: 'Baloo 2', sans-serif; font-size: clamp(14px, 4.5vw, 20px); font-weight: 800; color: var(--accent-dark); line-height: 1.1; }
  .day-date-col .wd { font-size: clamp(10px, 2.8vw, 13px); color: var(--ink-soft); margin-top: 2px; font-weight: 700; }

  .day-body { flex: 1; min-width: 0; }
  .day-activity { font-size: clamp(13px, 3.5vw, 16px); line-height: 1.75; color: var(--ink); white-space: pre-line; font-weight: 500; }
  .day-activity a { color: var(--accent-dark); text-decoration: underline; font-weight: 700; }
  .day-stay {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: clamp(11px, 2.8vw, 13px); font-weight: 700; color: var(--ink);
    background: var(--lavender); border: 1.5px solid var(--ink);
    border-radius: 999px;
    padding: 3px 10px; margin-top: 9px;
  }

  .note-header {
    display: flex; align-items: center; gap: 6px;
    width: calc(100% - 20px); margin: 0 10px 10px;
    background: var(--peach);
    border: 2px solid var(--ink);
    border-radius: 12px;
    padding: 6px 11px;
    font-size: 14px;
    color: var(--ink);
    font-weight: 700;
  }
  .note-header .count {
    background: var(--accent-dark);
    color: #fff;
    border-radius: 999px;
    font-size: 12px;
    padding: 1px 7px;
    font-weight: 700;
  }

  .note-panel {
    padding: 0 10px 12px;
  }

  .note-sheet {
    position: relative;
    background: var(--panel);
    border: 2px dashed var(--panel-line);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
    transform: rotate(-.3deg);
  }
  .note-line { font-size: 15px; color: var(--ink); line-height: 1.7; font-weight: 500; }
  .note-line a { color: var(--accent-dark); text-decoration: underline; }
  .note-line + .note-line { margin-top: 6px; }
  .note-who {
    display: inline-block;
    font-weight: 800;
    color: #2a2a2a;
    border: 1.5px dashed var(--who-color, var(--ink-soft));
    background: color-mix(in srgb, var(--who-color, var(--ink-soft)) 14%, transparent);
    border-radius: 999px;
    padding: 1px 9px;
    margin-right: 6px;
    font-size: 13px;
  }
  .note-empty { font-size: 14px; color: var(--ink-soft); text-align: center; padding: 8px 0 14px; font-weight: 600; }

  .note-form { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .note-form select {
    flex: 0 0 clamp(76px, 22vw, 104px);
    min-width: 0;
    font-size: clamp(12px, 3.2vw, 14px); font-weight: 700;
    border: 2px solid var(--ink);
    border-radius: 10px;
    padding: 0 4px;
    background: var(--panel);
    color: var(--ink);
    font-family: inherit;
  }
  .note-form input[type="text"] {
    flex: 1 1 120px;
    min-width: 0;
    font-size: clamp(13px, 3.5vw, 15px);
    border: none;
    border-bottom: 2px dashed var(--panel-line);
    padding: 8px 4px;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
  }
  .note-form input[type="text"]:focus, .note-form select:focus { outline: none; border-color: var(--accent-dark); }
  .note-form button {
    flex: 0 0 auto;
    background: var(--accent);
    color: #fff;
    border: 2px solid var(--ink);
    border-radius: 10px;
    padding: 0 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 2px 2px 0 rgba(107,84,64,.15);
  }
  .note-form button:active { transform: translateY(1px); box-shadow: 1px 1px 0 rgba(107,84,64,.15); }
  .note-form button:disabled { opacity: .5; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: #fff; font-size: 19px; font-weight: 700;
    padding: 9px 18px; border-radius: 999px; z-index: 999;
    box-shadow: 3px 3px 0 rgba(0,0,0,.15);
    animation: fadeUp .25s ease-out;
  }
  .toast.error { background: var(--peach-dark); }
  @keyframes fadeUp { from { opacity: 0; transform: translate(-50%, 8px);} to { opacity: 1; transform: translate(-50%, 0);} }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="doodle left">🐻</span>
    <span class="doodle right">🌟</span>
    <h1>紐約．班夫．黃刀鎮 極光之旅</h1>
    <p>2026年11月26日 ~ 12月8日</p>
  </div>

  <div class="updated-bar"><span class="dot"></span><span id="lastUpdatedText">行程最後更新：2026/10/12</span></div>

  <div class="cal-card">
    <div class="cal-tape"></div>
    <div class="cal-weekdays">
      <span class="weekend">日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="weekend">六</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend" id="calLegend"></div>
  </div>

  <div class="day-nav">
    <button class="nav-btn" id="prevBtn" onclick="shiftDay(-1)">‹</button>
    <span class="nav-label" id="dayNavLabel"></span>
    <button class="nav-btn" id="nextBtn" onclick="shiftDay(1)">›</button>
  </div>

  <div id="dayDetail"></div>
</div>

<script>
// ===== 行程資料：每次改行程記得更新下面的 LAST_UPDATED =====
const LAST_UPDATED = '2026/10/24';

const itinerary = [
  { key: '11-25', date: '11/25', day: '二', activity: '', stay: '台灣', stayIcon: '📍' },
  { key: '11-26', date: '11/26', day: '三', activity: '🛬 抵達紐約 (TPE→JFK)', stay: '大姐家' },
  { key: '11-27', date: '11/27', day: '四', activity: '🏙️ 市區觀光', stay: '大姐家' },
  { key: '11-28', date: '11/28', day: '五', activity: '🏔️ 卡加利 (EWR→YYC)', stay: 'Delta Hotels' },
  { key: '11-29', date: '11/29', day: '六', activity: '🚌 <a href="https://www.getyourguide.com/banff-l284/lake-louise-emerald-moraine-canyon-hike-bridge-yoho-to-t1074469/" target="_blank" rel="noopener">Lake Louise, Emerald, Moraine, Canyon hike, Bridge & Yoho tour</a>\n⏰ 08:00-19:00\n\n行程內容：\n・Cascade Mountain（途經）\n・Castle Mountain（拍照停留）\n・Lake Louise（導覽行程）\n・Emerald Lake\n・Natural bridge\n・Marble canyon\n・Banff town\n\n🍴 午餐：Lake Louise Village North', stay: 'Delta Hotels' },
  { key: '11-30', date: '11/30', day: '日', activity: '🛬 抵達黃刀鎮 (YYC→YZF)\n🌌 22:00 <a href="https://sites.google.com/view/dragonpalacetravel/%E8%A1%8C%E7%A8%8B%E8%88%87%E6%B4%BB%E5%8B%95tour-package-activities/%E5%86%AC%E9%BE%8D%E5%BD%A9%E9%BB%83%E5%88%80%E6%A5%B5%E5%85%894%E6%97%A5?pli=1&amp;authuser=0" target="_blank" rel="noopener">極光之旅-湖畔木屋營地</a>', stay: 'Chateau Nova' },
  { key: '12-01', date: '12/01', day: '一', activity: '🏙️ 13:30 黃刀鎮市區觀光 (約 2.5 小時)\n🍽️ 網紅魚餐廳 Bullocks Bistro or 原住民酒吧（自費晚餐option）\n🌌 22:00 追獵極光', stay: 'Chateau Nova' },
  { key: '12-02', date: '12/02', day: '二', activity: '🐟 10:30 冰凍大奴湖捕魚體驗+午餐\n🐕 13:00 狗拉雪橇\n🌌 22:00 極光圈區追獵極光', stay: 'Chateau Nova' },
  { key: '12-03', date: '12/03', day: '三', activity: '🛬 搭機返回紐約 (YZF→EWR)', stay: '大姐家' },
  { key: '12-04', date: '12/04', day: '四', activity: '🏙️ 市區觀光', stay: '大姐家' },
  { key: '12-05', date: '12/05', day: '五', activity: '🏙️ 市區觀光\n🎒 準備行李', stay: '大姐家' },
  { key: '12-06', date: '12/06', day: '六', activity: '🏰 Oheka Castle\n🇹🇼 紅眼班機返台', stay: '紐約/台灣', stayIcon: '📍' },
  { key: '12-08', date: '12/08', day: '一', activity: '', stay: '台灣', stayIcon: '📍' },
];

// ===== 迷你月曆：城市分段上色 + 自訂標籤 =====
const citySegments = {
  flight: { label: '飛行日', color: '#ffceb0' },
  ny:     { label: '紐約',   color: '#c9ead7' },
  banff:  { label: '班夫',   color: '#ffe3a1' },
  yzf:    { label: '黃刀鎮', color: '#ddd1f5' },
  home:   { label: '返台',   color: '#f8cdd7' },
};

const dayMeta = {
  '11/25': { seg: 'flight', icon: '✈️', tag: '台灣/出發!' },
  '11/26': { seg: 'flight', icon: '✈️', tag: '紐約' },
  '11/27': { seg: 'ny',     icon: '🗽', tag: '紐約' },
  '11/28': { seg: 'banff',  icon: '✈️', tag: '卡加利' },
  '11/29': { seg: 'banff',  icon: '🏔️', tag: '卡加利/班夫' },
  '11/30': { seg: 'yzf',    icon: '❄️', tag: '黃刀鎮' },
  '12/01': { seg: 'yzf',    icon: '⛄', tag: '黃刀鎮' },
  '12/02': { seg: 'yzf',    icon: '🎣', tag: '黃刀鎮' },
  '12/03': { seg: 'ny',     icon: '✈️', tag: '紐約' },
  '12/04': { seg: 'ny',     icon: '🏢', tag: '紐約' },
  '12/05': { seg: 'ny',     icon: '🌉', tag: '紐約' },
  '12/06': { seg: 'home',   icon: '✈️', tag: '紐約/回家~' },
  '12/08': { seg: 'home',   icon: '✈️', tag: '台灣' },
};

// 3 週（7 欄）排版，含行程前後的留白日期；12/07 為換日線，無獨立行程卡
const calWeeks = [
  [{d:'11/23'},{d:'11/24'},{d:'11/25'},{d:'11/26'},{d:'11/27'},{d:'11/28'},{d:'11/29'}],
  [{d:'11/30'},{d:'12/01'},{d:'12/02'},{d:'12/03'},{d:'12/04'},{d:'12/05'},{d:'12/06'}],
  [{d:'12/07', transit:true},{d:'12/08'},null,null,null,null,null],
];

function renderCalendar() {
  const cellsHtml = calWeeks.flat().map(cell => {
    if (!cell) return `<div class="cal-cell empty"></div>`;
    if (cell.transit) {
      return `<div class="cal-cell transit" title="跨越國際換日線">
                <span class="icon">✈️</span>
                <span class="num">${cell.d}</span>
                <span class="tag">換日線</span>
              </div>`;
    }
    const meta = dayMeta[cell.d];
    if (!meta) {
      return `<div class="cal-cell pad"><span class="num">${cell.d}</span></div>`;
    }
    const seg = citySegments[meta.seg];
    const key = cell.d.replace('/', '-');
    const hasCard = itinerary.some(it => it.key === key);
    const clickAttr = hasCard ? ` onclick="jumpToDay('${key}')"` : '';
    return `<div class="cal-cell trip" style="background:${seg.color}"${clickAttr}>
              <span class="icon">${meta.icon}</span>
              <span class="num">${cell.d}</span>
              <span class="tag">${meta.tag}</span>
            </div>`;
  }).join('');
  document.getElementById('calGrid').innerHTML = cellsHtml;

  const legendHtml = Object.values(citySegments).map(s =>
    `<div class="item"><span class="swatch" style="background:${s.color}"></span>${s.label}</div>`
  ).join('');
  document.getElementById('calLegend').innerHTML = legendHtml;
}

function jumpToDay(key) {
  const idx = itinerary.findIndex(it => it.key === key);
  if (idx === -1) return;
  selectedIndex = idx;
  renderDetail();
  document.getElementById('dayDetail').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

renderCalendar();

document.getElementById('lastUpdatedText').textContent = '行程最後更新：' + LAST_UPDATED;

const webAppUrl = 'https://script.google.com/macros/s/AKfycbzX0ZtriCa4xuMtXBtwKTJTHRfR3Hvr8-9e9pDYykRD0Fc63ZK5JPDTXK5qP7X-qCWn/exec';
const users = ['', 'Joyce', 'Julian', '410', 'Grace', '👭'];
const userLabels = { '👭': '👭' };
const userColors = {
  'Joyce': '#e3b24f',
  'Julian': '#7fc3a3',
  '410': '#b19be0',
  'Grace': '#4ea8c9',
  '👭': '#e8a3b4',
};
function getUserColor(name) { return userColors[name] || '#a6927c'; }

let currentUser = localStorage.getItem('currentUser') || '';
let allNotes = [];
let selectedIndex = 0;

function renderDetail() {
  const item = itinerary[selectedIndex];
  const meta = dayMeta[item.date] || {};
  const notes = allNotes.filter(n => n.date === item.date);

  document.getElementById('dayNavLabel').textContent = `${item.date}（週${item.day}）`;
  document.getElementById('prevBtn').disabled = selectedIndex === 0;
  document.getElementById('nextBtn').disabled = selectedIndex === itinerary.length - 1;

  const html = `
    <div class="day-card" id="card-${item.key}">
      <div class="day-tape"></div>
      <div class="day-main">
        <div class="day-date-col">
          <span class="icon">${meta.icon || '📍'}</span>
          <div class="md">${item.date}</div>
          <div class="wd">週${item.day}</div>
        </div>
        <div class="day-body">
          <div class="day-activity">${item.activity}</div>
          ${item.stay ? `<span class="day-stay">${item.stayIcon || '🏨'} ${item.stay}</span>` : ''}
        </div>
      </div>
      <div class="note-header">
        📝 行程說明/備註
      </div>
      <div class="note-panel">
        ${notes.length
          ? `<div class="note-sheet">
              ${notes.map(n => `
                <div class="note-line" style="--who-color:${getUserColor(n.user)}">
                  ${n.user ? `<span class="note-who">${n.user}</span>` : ''}${n.message}
                </div>`).join('')}
            </div>`
          : `<div class="note-empty">還沒有備註/說明，第一個留言給大家看看吧 👋</div>`
        }
        <div class="note-form">
          <select id="userSel-${item.key}">
            ${users.map(u => `<option value="${u}" ${u === currentUser ? 'selected' : ''}>${userLabels[u] || u}</option>`).join('')}
          </select>
          <input type="text" id="noteInput-${item.key}" placeholder="寫點備註/說明...">
          <button onclick="addNote('${item.key}', '${item.date}')">送出</button>
        </div>
      </div>
    </div>`;
  document.getElementById('dayDetail').innerHTML = html;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function shiftDay(delta) {
  const next = selectedIndex + delta;
  if (next < 0 || next >= itinerary.length) return;
  selectedIndex = next;
  renderDetail();
}

function addNote(key, date) {
  const input = document.getElementById('noteInput-' + key);
  const sel = document.getElementById('userSel-' + key);
  const message = input.value.trim();
  const user = sel.value;
  if (!message) return;

  currentUser = user;
  localStorage.setItem('currentUser', user);

  const btn = input.nextElementSibling;
  input.disabled = true;
  if (btn) btn.disabled = true;

  fetch(webAppUrl, {
    method: 'POST',
    body: JSON.stringify({ action: 'addNote', date, user, message })
  })
  .then(r => r.json())
  .then(data => {
    input.disabled = false;
    if (btn) btn.disabled = false;
    if (data.success) {
      input.value = '';
      showToast('✅ 留言已送出');
      loadNotes();
    } else {
      showToast('❌ 送出失敗：' + (data.error || '未知錯誤'), true);
    }
  })
  .catch(err => {
    input.disabled = false;
    if (btn) btn.disabled = false;
    showToast('❌ 網路錯誤：' + err.message, true);
  });
}

function loadNotes() {
  fetch(webAppUrl + '?action=getNotes')
    .then(r => r.json())
    .then(data => {
      allNotes = data.notes || [];
      renderDetail();
    })
    .catch(err => console.error('載入留言失敗：', err));
}

renderDetail();
loadNotes();
setInterval(() => loadNotes(), 15000);

function showToast(msg, isError) {
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' error' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}
</script>
</body>
</html>
